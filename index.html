<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #E8ECEA;
      --surface: #F7F9F8;
      --paper: #FDFDFB;
      --ink: #16202A;
      --muted: #4F606C;
      --line: #C5CEC9;
      --field: #8C9B95;
      --accent: #1F4FD8;
      --hit: #17673F;
      --hit-bg: #D8EEE2;
      --miss: #7A4A00;
      --miss-bg: #F6E3BF;
      --bad: #A8201A;
      --bad-bg: #FBE4E1;
      --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --receipt: "Courier Prime", "Courier New", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { color-scheme: light; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--sans); }
    h1, h2, p { margin: 0; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Header and request strip */
    .top { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 1rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: space-between; }
    h1 { font-size: 1.625rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em; }
    .brand p { margin-top: 0.25rem; color: var(--muted); }
    .wire-wrap { position: relative; max-width: 100%; }
    .wire { display: flex; flex-wrap: wrap; gap: 0.625rem; align-items: center; font: inherit; font-size: 0.9rem; padding: 0.5rem 0.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; text-align: left; }
    .wire-log { position: absolute; right: 0; top: calc(100% + 0.375rem); z-index: 5; margin: 0; padding: 0.25rem 0.5rem; list-style: none; width: min(34rem, calc(100vw - 2.5rem)); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(22, 32, 42, 0.14); }
    .wire-log li { display: flex; flex-wrap: wrap; gap: 0.625rem; padding: 0.4375rem 0; font-size: 0.875rem; border-bottom: 1px solid var(--line); }
    .wire-log li:last-child { border-bottom: 0; }
    .m { font-weight: 700; }
    .status.bad { color: var(--bad); font-weight: 700; }
    .ms { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cache { padding: 0 0.5rem; border-radius: 4px; font-weight: 700; font-size: 0.8125rem; }
    .cache.hit { background: var(--hit-bg); color: var(--hit); }
    .cache.miss { background: var(--miss-bg); color: var(--miss); }
    .cache.none { padding: 0; color: var(--muted); font-weight: 500; }

    /* Page layout */
    .layout { max-width: 1180px; margin: 0 auto; padding: 0.5rem 1.25rem 3rem; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 2rem; align-items: start; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    h2 { font-size: 1.125rem; font-weight: 650; }

    /* Buttons */
    .btn { font: inherit; font-size: 0.9375rem; font-weight: 600; padding: 0.4375rem 0.875rem; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
    .btn:hover:not(:disabled) { background: rgba(31, 79, 216, 0.08); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #173FB0; }
    .btn.quiet { border-color: transparent; color: var(--ink); font-weight: 500; }
    .btn.quiet:hover:not(:disabled) { background: rgba(22, 32, 42, 0.08); }
    .btn.danger { color: var(--bad); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Catalog */
    .tabs { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 0.75rem; }
    .tab { font: inherit; font-size: 0.9375rem; padding: 0.375rem 0.875rem; border: 1px solid var(--field); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
    .tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .summary { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin-bottom: 0.75rem; color: var(--muted); font-size: 0.9375rem; }
    .summary strong { color: var(--ink); font-weight: 600; }
    .rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 7rem auto; gap: 0.5rem 1rem; align-items: center; padding: 0.875rem 1rem; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .name { display: flex; flex-direction: column; min-width: 0; }
    .title { font-weight: 600; overflow-wrap: anywhere; }
    .cat { color: var(--muted); font-size: 0.875rem; }
    .price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .stock { font-size: 0.9375rem; color: var(--muted); }
    .stock.low { color: var(--miss); font-weight: 600; }
    .actions { display: flex; gap: 0.375rem; justify-content: flex-end; flex-wrap: wrap; }
    .notice { padding: 1.25rem 1rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }

    /* Order slip */
    .slip-col { position: sticky; top: 1rem; }
    .slip { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 1.25rem 1.25rem 1.5rem; box-shadow: 0 1px 0 var(--line), 0 10px 24px -12px rgba(22, 32, 42, 0.25); font-family: var(--receipt); font-size: 0.9375rem; }
    .slip h2 { font-family: var(--receipt); font-size: 1.0625rem; font-weight: 700; margin-bottom: 0.875rem; padding-bottom: 0.75rem; border-bottom: 2px dashed var(--field); }
    .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.875rem; }
    .field label { font-weight: 700; font-size: 0.9375rem; }
    .field input { font: inherit; font-size: 1rem; padding: 0.5rem 0.625rem; border: 1px solid var(--field); border-radius: 6px; background: #fff; color: var(--ink); }
    .lines { list-style: none; margin: 0 0 0.75rem; padding: 0 0 0.75rem; border-bottom: 2px dashed var(--field); }
    .line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.25rem 0.75rem; align-items: center; padding: 0.375rem 0; }
    .ln { overflow-wrap: anywhere; }
    .stepper { display: inline-flex; align-items: center; gap: 0.25rem; }
    .stepper button { width: 1.75rem; height: 1.75rem; border: 1px solid var(--field); border-radius: 4px; background: #fff; font: inherit; line-height: 1; cursor: pointer; color: var(--ink); }
    .stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty { min-width: 1.5rem; text-align: center; font-variant-numeric: tabular-nums; }
    .lt { text-align: right; min-width: 4.5rem; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); }
    .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.125rem; margin-bottom: 1rem; }
    .place { width: 100%; padding: 0.625rem; }
    .error { margin-bottom: 0.875rem; padding: 0.625rem 0.75rem; background: var(--bad-bg); color: var(--bad); border-radius: 4px; font-family: var(--sans); font-size: 0.9375rem; }
    .error:empty { display: none; }

    /* Printed receipt (the one animated moment) */
    .r-title { font-weight: 700; font-size: 1.125rem; }
    .r-meta { margin: 0.125rem 0 0.75rem; color: var(--muted); font-size: 0.875rem; }
    .r-lines { list-style: none; margin: 0 0 0.75rem; padding: 0.75rem 0; border-top: 2px dashed var(--field); border-bottom: 2px dashed var(--field); }
    .r-lines li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.125rem 0; }
    .r-total { display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-weight: 700; font-size: 1.125rem; }
    .r-note { margin-bottom: 1rem; color: var(--muted); font-size: 0.875rem; }
    .printing { animation: print 0.9s steps(14, end) both; }
    @keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

    /* Dialogs and toast */
    dialog { border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; width: calc(100% - 2rem); max-width: 26rem; background: var(--surface); color: var(--ink); font: inherit; }
    dialog::backdrop { background: rgba(22, 32, 42, 0.45); }
    dialog h2 { margin-bottom: 1rem; }
    dialog .field label { font-weight: 600; }
    .hint { color: var(--muted); font-size: 0.9375rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
    .toast { position: fixed; left: 1.25rem; bottom: 1.25rem; z-index: 10; background: var(--ink); color: #fff; padding: 0.625rem 0.875rem; border-radius: 6px; opacity: 0; transform: translateY(0.5rem); pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .slip-col { position: static; }
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name price" "stock actions"; }
      .name { grid-area: name; }
      .price { grid-area: price; }
      .stock { grid-area: stock; }
      .actions { grid-area: actions; }
    }
    @media (prefers-reduced-motion: reduce) {
      .printing { animation: none; }
      .toast { transition: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Stockroom</h1>
      <p>Store inventory and orders</p>
    </div>
    <div class="wire-wrap">
      <button type="button" id="wire" class="wire" aria-expanded="false" aria-controls="wire-log" title="Show recent requests"></button>
      <ol id="wire-log" class="wire-log" hidden></ol>
    </div>
  </header>

  <main class="layout">
    <section aria-labelledby="catalog-h">
      <div class="bar">
        <h2 id="catalog-h">Products</h2>
        <button type="button" id="add-product" class="btn primary">Add product</button>
      </div>
      <div id="tabs" class="tabs" role="group" aria-label="Filter by category"></div>
      <p id="summary" class="summary"></p>
      <ul id="products" class="rows"></ul>
    </section>

    <aside class="slip-col">
      <section id="slip" class="slip" aria-labelledby="slip-h">
        <h2 id="slip-h">Order slip</h2>

        <form id="order-form">
          <div class="field">
            <label for="customer">Customer name</label>
            <input id="customer" name="customer" type="text" maxlength="100" required autocomplete="off">
          </div>
          <ul id="lines" class="lines"></ul>
          <p class="total"><span>Total</span><span id="total"></span></p>
          <p id="order-error" class="error" role="alert"></p>
          <button type="submit" id="place" class="btn primary place">Place order</button>
        </form>

        <div id="receipt" hidden></div>
      </section>
    </aside>
  </main>

  <dialog id="product-dialog" aria-labelledby="product-title">
    <form id="product-form">
      <h2 id="product-title">Add product</h2>
      <div class="field">
        <label for="f-name">Name</label>
        <input id="f-name" type="text" maxlength="100" required>
      </div>
      <div class="field">
        <label for="f-category">Category</label>
        <input id="f-category" type="text" maxlength="50" list="category-list" required>
        <datalist id="category-list"></datalist>
      </div>
      <div class="field">
        <label for="f-price">Price</label>
        <input id="f-price" type="number" min="0.01" step="0.01" required inputmode="decimal">
      </div>
      <div class="field">
        <label for="f-stock">Stock</label>
        <input id="f-stock" type="number" min="0" step="1" required inputmode="numeric">
      </div>
      <p id="product-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-product" class="btn quiet">Cancel</button>
        <button type="submit" id="save-product" class="btn primary">Save product</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">Delete product</h2>
    <p>Delete <strong id="delete-name"></strong>? Products that appear in an order can't be deleted.</p>
    <p id="delete-error" class="error" role="alert" style="margin-top: 0.875rem"></p>
    <div class="dialog-actions">
      <button type="button" id="cancel-delete" class="btn quiet">Cancel</button>
      <button type="button" id="confirm-delete" class="btn primary">Delete product</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const CURRENCY = 'USD'; // change to 'INR', 'EUR', ... to reformat prices
    const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: CURRENCY });
    const $ = (selector) => document.querySelector(selector);

    const state = {
      products: [],
      summary: [],
      category: null,          // null = all categories
      categories: new Set(),
      loaded: false,
      loadError: '',
      cart: new Map(),         // productId -> { id, name, price, stock, qty }
      log: []                  // most recent request first
    };

    /* ---------- tiny DOM helper (text is always set as text, never as HTML) ---------- */
    function h(tag, props = {}, ...kids) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value == null || value === false) continue;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'value') node.value = value;
        else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value === true ? '' : value);
      }
      node.append(...kids.flat().filter((kid) => kid != null && kid !== false));
      return node;
    }

    /* ---------- API access ---------- */
    class ApiError extends Error {
      constructor(status, message) { super(message); this.status = status; }
    }

    function problemText(data) {
      if (!data) return '';
      if (data.errors) return Object.values(data.errors).flat().join(' ');
      return [data.title, data.detail].filter(Boolean).join('. ');
    }

    async function api(path, { method = 'GET', body } = {}) {
      const started = performance.now();
      let response;
      try {
        response = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
      } catch {
        logRequest({ method, path, status: 0, cache: null, ms: Math.round(performance.now() - started) });
        throw new ApiError(0, "Can't reach the API. Check that the app is running, then try again.");
      }

      const ms = Math.round(performance.now() - started);
      logRequest({ method, path, status: response.status, cache: response.headers.get('X-Cache'), ms });

      const text = await response.text();
      let data = null;
      if (text) { try { data = JSON.parse(text); } catch { /* non-JSON body */ } }

      if (!response.ok) {
        const fallback = response.status === 404
          ? 'This item no longer exists. Reload the list.'
          : `The request failed (status ${response.status}).`;
        throw new ApiError(response.status, problemText(data) || fallback);
      }
      return data;
    }

    /* ---------- request strip ---------- */
    function logRequest(entry) {
      state.log.unshift(entry);
      state.log.length = Math.min(state.log.length, 10);
      renderWire();
    }

    function entryNodes(e) {
      return [
        h('span', { class: 'm', text: e.method }),
        h('span', { text: e.path }),
        h('span', { class: 'status' + (e.status === 0 || e.status >= 400 ? ' bad' : ''), text: e.status === 0 ? 'offline' : String(e.status) }),
        e.cache
          ? h('span', { class: 'cache ' + e.cache.toLowerCase(), text: e.cache })
          : h('span', { class: 'cache none', text: 'not cached' }),
        h('span', { class: 'ms', text: `${e.ms} ms` })
      ];
    }

    function renderWire() {
      const last = state.log[0];
      $('#wire').replaceChildren(...(last ? entryNodes(last) : [h('span', { text: 'No requests yet' })]));
      $('#wire-log').replaceChildren(...state.log.map((e) => h('li', {}, entryNodes(e))));
    }

    $('#wire').addEventListener('click', () => {
      const open = $('#wire-log').hidden;
      $('#wire-log').hidden = !open;
      $('#wire').setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !$('#wire-log').hidden) {
        $('#wire-log').hidden = true;
        $('#wire').setAttribute('aria-expanded', 'false');
        $('#wire').focus();
      }
    });

    /* ---------- catalog ---------- */
    async function loadCatalog() {
      const query = state.category ? `?category=${encodeURIComponent(state.category)}` : '';
      try {
        const data = await api(`/api/products${query}`);
        state.products = data.products;
        state.summary = data.summary;
        if (state.category) data.summary.forEach((s) => state.categories.add(s.category));
        else state.categories = new Set(data.summary.map((s) => s.category));
        state.loadError = '';
      } catch (err) {
        state.loadError = err.message;
      }
      state.loaded = true;
      renderCatalog();
    }

    function renderCatalog() {
      renderTabs();
      renderSummary();
      renderRows();
    }

    function renderTabs() {
      const names = [...state.categories].sort((a, b) => a.localeCompare(b));
      const tab = (label, value) => h('button', {
        type: 'button',
        class: 'tab',
        'aria-pressed': String(state.category === value),
        onclick: () => { state.category = value; loadCatalog(); },
        text: label
      });
      $('#tabs').replaceChildren(tab('All', null), ...names.map((name) => tab(name, name)));
      $('#category-list').replaceChildren(...names.map((name) => h('option', { value: name })));
    }

    function renderSummary() {
      $('#summary').replaceChildren(...state.summary.map((s) => h('span', {},
        h('strong', { text: s.category }),
        ` ${s.productCount} ${s.productCount === 1 ? 'product' : 'products'}, average ${money.format(s.averagePrice)}`)));
    }

    function renderRows() {
      const list = $('#products');
      if (!state.loaded) {
        list.replaceChildren(h('li', { class: 'notice', text: 'Loading products…' }));
      } else if (state.loadError) {
        list.replaceChildren(h('li', { class: 'notice' },
          h('span', { text: state.loadError }),
          h('button', { type: 'button', class: 'btn', onclick: loadCatalog, text: 'Try again' })));
      } else if (!state.products.length) {
        list.replaceChildren(h('li', { class: 'notice' },
          h('span', { text: state.category ? `No products in ${state.category}.` : 'No products yet.' }),
          h('button', { type: 'button', class: 'btn', onclick: () => openProductDialog(), text: 'Add product' })));
      } else {
        list.replaceChildren(...state.products.map(productRow));
      }
    }

    function productRow(p) {
      const out = p.stock === 0;
      const low = p.stock <= 5;
      const stockText = out ? 'Out of stock' : low ? `${p.stock} left` : `${p.stock} in stock`;
      return h('li', { class: 'row' },
        h('div', { class: 'name' },
          h('span', { class: 'title', text: p.name }),
          h('span', { class: 'cat', text: p.category })),
        h('span', { class: 'price', text: money.format(p.price) }),
        h('span', { class: 'stock' + (low ? ' low' : ''), text: stockText }),
        h('div', { class: 'actions' },
          h('button', { type: 'button', class: 'btn', disabled: out, 'aria-label': `Add ${p.name} to order`, onclick: () => addToCart(p), text: 'Add to order' }),
          h('button', { type: 'button', class: 'btn quiet', 'aria-label': `Edit ${p.name}`, onclick: () => openProductDialog(p), text: 'Edit' }),
          h('button', { type: 'button', class: 'btn quiet danger', 'aria-label': `Delete ${p.name}`, onclick: () => openDeleteDialog(p), text: 'Delete' })));
    }

    /* ---------- order slip ---------- */
    function addToCart(product) {
      showForm(false);
      const line = state.cart.get(product.id);
      if (!line) {
        state.cart.set(product.id, { id: product.id, name: product.name, price: product.price, stock: product.stock, qty: 1 });
      } else if (line.qty < line.stock) {
        line.qty += 1;
      } else {
        toast(`Only ${line.stock} of ${line.name} in stock`);
      }
      renderSlip();
    }

    function changeQty(line, delta) {
      line.qty += delta;
      if (line.qty <= 0) state.cart.delete(line.id);
      renderSlip();
      const wanted = delta > 0 ? 'inc' : 'dec';
      const other = delta > 0 ? 'dec' : 'inc';
      (document.querySelector(`[data-act="${line.id}:${wanted}"]:not(:disabled)`)
        ?? document.querySelector(`[data-act="${line.id}:${other}"]:not(:disabled)`))?.focus();
    }

    function lineNode(line) {
      return h('li', { class: 'line' },
        h('span', { class: 'ln', text: line.name }),
        h('div', { class: 'stepper', role: 'group', 'aria-label': `Quantity for ${line.name}` },
          h('button', { type: 'button', 'data-act': `${line.id}:dec`, 'aria-label': `Decrease quantity of ${line.name}`, onclick: () => changeQty(line, -1), text: '−' }),
          h('span', { class: 'qty', text: String(line.qty) }),
          h('button', { type: 'button', 'data-act': `${line.id}:inc`, 'aria-label': `Increase quantity of ${line.name}`, disabled: line.qty >= line.stock, onclick: () => changeQty(line, 1), text: '+' })),
        h('span', { class: 'lt', text: money.format(line.price * line.qty) }));
    }

    function renderSlip() {
      const lines = [...state.cart.values()];
      $('#lines').replaceChildren(...(lines.length
        ? lines.map(lineNode)
        : [h('li', { class: 'empty', text: 'Add products from the list to start an order.' })]));
      $('#total').textContent = money.format(lines.reduce((sum, l) => sum + l.price * l.qty, 0));
      $('#place').disabled = lines.length === 0;
    }

    function showForm(focus = true) {
      $('#receipt').hidden = true;
      $('#order-form').hidden = false;
      if (focus) $('#customer').focus();
    }

    function showReceipt(order, names) {
      const receipt = $('#receipt');
      receipt.replaceChildren(
        h('p', { class: 'r-title', text: `Order #${order.id}` }),
        h('p', { class: 'r-meta', text: `${order.customerName}, ${new Date(order.createdUtc).toLocaleString()}` }),
        h('ul', { class: 'r-lines' }, order.items.map((item) => h('li', {},
          h('span', { text: `${item.quantity} × ${names.get(item.productId) ?? 'Product ' + item.productId}` }),
          h('span', { text: money.format(item.quantity * item.unitPrice) })))),
        h('p', { class: 'r-total' }, h('span', { text: 'Total' }), h('span', { text: money.format(order.total) })),
        h('p', { class: 'r-note', text: 'Order and stock updates were saved together.' }),
        h('button', { type: 'button', id: 'new-order', class: 'btn primary', onclick: () => showForm(), text: 'Start new order' }));
      $('#order-form').hidden = true;
      receipt.hidden = false;
      receipt.classList.remove('printing');
      void receipt.offsetWidth; // restart the animation
      receipt.classList.add('printing');
      $('#new-order').focus();
    }

    $('#order-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const items = [...state.cart.values()].map((l) => ({ productId: l.id, quantity: l.qty }));
      if (!items.length) return;

      const names = new Map([...state.cart.values()].map((l) => [l.id, l.name]));
      const button = $('#place');
      $('#order-error').textContent = '';
      button.disabled = true;
      button.textContent = 'Placing order…';

      try {
        const order = await api('/api/orders', { method: 'POST', body: { customerName: $('#customer').value.trim(), items } });
        state.cart.clear();
        $('#customer').value = '';
        renderSlip();
        showReceipt(order, names);
        await loadCatalog();
      } catch (err) {
        const detail = err.message.replace(/Product (\d+)/, (match, id) => names.get(Number(id)) ?? match);
        $('#order-error').textContent = err.status === 409 ? `${detail} Your order slip is unchanged.` : detail;
      } finally {
        button.textContent = 'Place order';
        button.disabled = state.cart.size === 0;
      }
    });

    /* ---------- product dialog ---------- */
    const productDialog = $('#product-dialog');
    let editing = null;

    function openProductDialog(product = null) {
      editing = product;
      $('#product-title').textContent = product ? 'Edit product' : 'Add product';
      $('#f-name').value = product?.name ?? '';
      $('#f-category').value = product?.category ?? (state.category ?? '');
      $('#f-price').value = product ? product.price.toFixed(2) : '';
      $('#f-stock').value = product ? String(product.stock) : '';
      $('#product-error').textContent = '';
      productDialog.showModal();
      $('#f-name').focus();
    }

    $('#add-product').addEventListener('click', () => openProductDialog());
    $('#cancel-product').addEventListener('click', () => productDialog.close());

    $('#product-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = {
        name: $('#f-name').value.trim(),
        category: $('#f-category').value.trim(),
        price: Number($('#f-price').value),
        stock: Number.parseInt($('#f-stock').value, 10)
      };
      const button = $('#save-product');
      $('#product-error').textContent = '';
      button.disabled = true;

      try {
        if (editing) {
          await api(`/api/products/${editing.id}`, { method: 'PUT', body });
          syncCartLine(editing.id, body);
        } else {
          await api('/api/products', { method: 'POST', body });
        }
        state.categories.add(body.category);
        productDialog.close();
        toast('Product saved');
        await loadCatalog();
      } catch (err) {
        $('#product-error').textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });

    // Keep an in-progress order consistent with an edited product.
    function syncCartLine(id, body) {
      const line = state.cart.get(id);
      if (!line) return;
      line.name = body.name;
      line.price = body.price;
      line.stock = body.stock;
      line.qty = Math.min(line.qty, body.stock);
      if (line.qty <= 0) state.cart.delete(id);
      renderSlip();
    }

    /* ---------- delete dialog ---------- */
    const deleteDialog = $('#delete-dialog');
    let deleting = null;

    function openDeleteDialog(product) {
      deleting = product;
      $('#delete-name').textContent = product.name;
      $('#delete-error').textContent = '';
      deleteDialog.showModal();
      $('#cancel-delete').focus();
    }

    $('#cancel-delete').addEventListener('click', () => deleteDialog.close());
    $('#confirm-delete').addEventListener('click', async () => {
      const button = $('#confirm-delete');
      button.disabled = true;
      try {
        await api(`/api/products/${deleting.id}`, { method: 'DELETE' });
        state.cart.delete(deleting.id);
        renderSlip();
        deleteDialog.close();
        toast('Product deleted');
        await loadCatalog();
      } catch (err) {
        $('#delete-error').textContent = err.message.replace(/Product \d+/, deleting.name);
      } finally {
        button.disabled = false;
      }
    });

    /* ---------- toast ---------- */
    let toastTimer;
    function toast(message) {
      const node = $('#toast');
      node.textContent = message;
      node.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove('show'), 3000);
    }

    /* ---------- start ---------- */
    renderWire();
    renderSlip();
    renderRows();
    loadCatalog();
  </script>
</body>
</html>
